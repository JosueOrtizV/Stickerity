<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Drop shadow for the peel, casting onto the orange base -->
    <filter id="peelShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-6" dy="-6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Base shadow for the whole icon to make it pop -->
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- Rich Orange gradient for the base -->
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/> <!-- Lighter orange top-left -->
      <stop offset="50%" stop-color="#f97316"/> <!-- Brand orange middle -->
      <stop offset="100%" stop-color="#c2410c"/> <!-- Darker orange bottom-right -->
    </linearGradient>

    <!-- 3D Peel gradient (white to light grey to give a paper fold effect) -->
    <linearGradient id="foldGradient" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Main Orange Rounded Square -->
  <path d="
    M 128 48 
    H 384 
    A 80 80 0 0 1 464 128 
    V 320 
    C 464 320, 392 392, 320 464 
    H 128 
    A 80 80 0 0 1 48 384 
    V 128 
    A 80 80 0 0 1 128 48 Z" 
    fill="url(#orangeGradient)"
    filter="url(#iconShadow)" />

  <!-- The peeled corner (white fold) -->
  <!-- 
    Start at right edge: 464, 320
    Diagonal fold line to bottom edge: 320, 464
    Straight up (reflection of bottom edge): to 320, 384
    Arc (reflection of the rounded corner): to 384, 320
    Straight right (reflection of right edge): back to 464, 320
  -->
  <path d="
    M 464 320
    L 320 464
    V 384
    A 80 80 0 0 1 384 320
    Z" 
    fill="url(#foldGradient)" 
    filter="url(#peelShadow)" />
</svg>